# A complete replacement for the image's /etc/nginx/nginx.conf.
#
# Shipping the whole file rather than a conf.d drop-in keeps the runtime stage
# of the Dockerfile free of RUN steps (so arm64 needs no emulation) and makes
# every header this server sends explicit in one place.

# Fixed at 2 rather than `auto`. `auto` spawns one worker per core, which on a
# many-core homelab host means a dozen-plus workers -- tens of MB of RSS, and
# an OOM kill against the mem_limit in compose.yaml -- to serve a 250 KB static
# site that sees a handful of requests a day.
worker_processes  2;

# /var/run is not writable by the unprivileged nginx user, and the root
# filesystem is read-only in any case. /tmp is a tmpfs.
pid  /tmp/nginx.pid;

# No `user` directive: the master process already runs as nginx, so setting it
# would only produce a "makes sense only if the master process runs with
# super-user privileges" warning on every start.

# The literal `stderr`, not /dev/stderr. /dev/stderr is a symlink to
# /proc/self/fd/2, and *opening* it fails with EACCES whenever the process is
# not the owner of that descriptor -- which is exactly what happens if this
# container is ever run with a `user:` other than the image's own. The literal
# writes to the inherited descriptor and never opens a file, so it cannot fail.
error_log  stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Every path nginx may write to, moved under the tmpfs.
    client_body_temp_path  /tmp/nginx-client-body;
    proxy_temp_path        /tmp/nginx-proxy;
    fastcgi_temp_path      /tmp/nginx-fastcgi;
    uwsgi_temp_path        /tmp/nginx-uwsgi;
    scgi_temp_path         /tmp/nginx-scgi;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /dev/stdout  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip             on;
    gzip_vary        on;
    gzip_comp_level  6;
    gzip_min_length  256;
    gzip_types       text/plain
                     text/css
                     application/javascript
                     application/json
                     image/svg+xml;

    # Cache policy lives in a map, not in per-location `add_header`, because a
    # nested add_header discards every header inherited from the server block.
    # Driving Cache-Control through one server-level add_header keeps the
    # security headers attached to every response, 404s included.
    #
    # Regex entries are tested in declaration order, so the builds/ rule has to
    # come before the general /_nuxt/ rule.
    map $uri $cache_control {
        # HTML, /_payload.json and anything unrecognised. Nuxt stamps a build
        # id into index.html, and a stale copy would reference hashed bundles
        # that no longer exist after a redeploy -- so HTML must revalidate.
        default                    "no-cache";

        # Nuxt's update-check manifest. Caching this defeats its purpose.
        ~^/_nuxt/builds/           "no-cache";

        # Content-hashed bundles: the filename changes whenever the bytes do.
        ~^/_nuxt/                  "public, max-age=31536000, immutable";

        # Unhashed, rarely changing, cheap to re-fetch.
        ~*\.(?:ico|png|svg|webp)$  "public, max-age=604800";
    }

    server {
        # IPv4 only, and not an oversight. Docker's default bridge network has
        # IPv6 disabled, and `listen [::]:8080` is fatal -- not ignored -- when
        # the address family is unavailable, so adding it would turn a plain
        # `docker compose up` into a restart loop on most hosts. The published
        # port is NATed to this socket either way, so nothing is lost. (The
        # official image papers over this with an entrypoint script that
        # rewrites the config at boot; this container bypasses the entrypoint
        # to keep its root filesystem read-only.)
        listen       8080;
        server_name  _;

        root   /srv/www;
        index  index.html;

        add_header  Cache-Control           $cache_control  always;
        add_header  X-Content-Type-Options  nosniff         always;
        add_header  X-Frame-Options         DENY            always;
        add_header  Referrer-Policy         no-referrer     always;

        # 'unsafe-inline' is not a shortcut, it is forced: Nuxt emits an inline
        # hydration script and inlines the Tailwind build into a <style> tag,
        # neither carrying a nonce. The two Google hosts are the webfont
        # stylesheet and the font files it pulls.
        add_header  Content-Security-Policy  "default-src 'self'; base-uri 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"  always;

        # Note what is absent: clipboard-read and clipboard-write are
        # Permissions-Policy features, and naming them here would disable the
        # "On your clipboard" paste tray. Only features the app never touches
        # are switched off.
        add_header  Permissions-Policy  "geolocation=(), camera=(), microphone=(), payment=(), usb=()"  always;

        location = /healthz {
            access_log    off;
            default_type  text/plain;
            return        200  "ok\n";
        }

        # One prerendered route and no client-side router, so there is no SPA
        # catch-all: a wrong URL should 404 rather than quietly render the home
        # page and look like it worked.
        location / {
            try_files  $uri  $uri/  $uri.html  =404;
        }

        error_page  404  /404.html;

        location = /404.html {
            internal;
        }
    }
}
